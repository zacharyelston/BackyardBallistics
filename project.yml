name: SpudGunGolf
options:
  bundleIdPrefix: com.backyardballistics
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SpudCore:
    path: Packages/SpudCore
targets:
  SpudGunGolf:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: courses/sample-course.yaml
        buildPhase: resources
      # Your own course, if courses/local/course.yaml exists (git ignores it): the default course.
      - path: courses/local
        type: folder
        buildPhase: resources
    dependencies:
      - package: SpudCore
        product: CoreGeo
      - package: SpudCore
        product: SafetyKit
      - package: SpudCore
        product: RangingKit
      - package: SpudCore
        product: CourseKit
      - package: SpudCore
        product: BallisticsKit
      - package: SpudCore
        product: RoundKit
      - package: SpudCore
        product: GroupKit
      - package: SpudCore
        product: GroupLink
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: SpudGunGolf
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad turns every way (it often sits in a landscape keyboard stand). The camera screens'
        # reticle maths assumes portrait, so they ask for portrait until they handle landscape.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        NSCameraUsageDescription: SpudGunGolf uses the camera to measure flag poles and range the hole.
        NSLocationWhenInUseUsageDescription: SpudGunGolf uses your location to find the hole, check that a range lands on a course flag, and show your squad where you are while you're in one.
        NSLocalNetworkUsageDescription: SpudGunGolf finds and joins your squad's iPad on the local Wi-Fi, and downloads the course file from the course server.
        NSBonjourServices: [_spudgolf._tcp]
        # In a v3 squad the phone keeps reporting its position with the screen locked.
        UIBackgroundModes: [location]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  # v4 Theater Mode: the course owner's station (docs/THEATER_MODE.md). Watches squads as an
  # observer; it never sees or clears firing data. Signed to run locally, so it builds over SSH.
  SpudTheater:
    type: application
    platform: macOS
    sources:
      - App/Theater
    dependencies:
      - package: SpudCore
        product: CoreGeo
      - package: SpudCore
        product: SafetyKit
      - package: SpudCore
        product: CourseKit
      - package: SpudCore
        product: GroupKit
      - package: SpudCore
        product: GroupLink
    info:
      path: App/Theater/Info.plist
      properties:
        CFBundleDisplayName: SpudGunGolf Theater
        LSApplicationCategoryType: public.app-category.sports-games
        NSLocalNetworkUsageDescription: SpudGunGolf Theater finds the squads' iPads on the local network to watch the course.
        NSBonjourServices: [_spudgolf._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backyardballistics.spudtheater
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
