name: SpudGunGolf
options:
  bundleIdPrefix: com.backyardballistics
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RangingKit:
    path: Packages/RangingKit
targets:
  SpudGunGolf:
    type: application
    platform: iOS
    sources:
      - App/Sources
    dependencies:
      - package: RangingKit
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: SpudGunGolf
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: SpudGunGolf uses the camera to measure flag poles and range the lid.
        NSLocationWhenInUseUsageDescription: SpudGunGolf uses your location to find the hole and check that a range lands on a course flag.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backyardballistics.spudgungolf
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
