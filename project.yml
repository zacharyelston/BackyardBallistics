name: SpudGunGolf
options:
  bundleIdPrefix: com.backyardballistics
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SpudCore:
    path: Packages/SpudCore
targets:
  SpudGunGolf:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: courses/sample-course.yaml
        buildPhase: resources
    dependencies:
      - package: SpudCore
        product: CoreGeo
      - package: SpudCore
        product: SafetyKit
      - package: SpudCore
        product: RangingKit
      - package: SpudCore
        product: CourseKit
      - package: SpudCore
        product: BallisticsKit
      - package: SpudCore
        product: RoundKit
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: SpudGunGolf
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad turns every way (it often sits in a landscape keyboard stand). The camera screens'
        # reticle maths assumes portrait, so they ask for portrait until they handle landscape.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        NSCameraUsageDescription: SpudGunGolf uses the camera to measure flag poles and range the hole.
        NSLocationWhenInUseUsageDescription: SpudGunGolf uses your location to find the hole and check that a range lands on a course flag.
        NSLocalNetworkUsageDescription: SpudGunGolf downloads the course file from the course server on the local Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
